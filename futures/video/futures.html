  $("#mode").textContent = swapped ? "COMPILED" : "INTERPRETED"; $("#mode").style.color = swapped ? GREEN : AMBER;
  $("#sv").textContent = nDone.toLocaleString("en-US"); const sv = survAt(nDone); $("#ss").textContent = `${sv} ${sv === 1 ? "WORLD SURVIVES" : "WORLDS SURVIVE"}`;
  $("#status").innerHTML = t < T_HOT ? "" : t < T_COMP ? `compiling: rewriting itself in machine language ${"◐◓◑◒"[Math.floor(t * 8) % 4]}` : !swapped ? "compiled · checking it gives the same answers…" : `<span style="color:${GREEN}">✓ identical answers · switched over</span>`;
  st.clearRect(0, 0, 1700, 70); st.fillStyle = "#ffffff14"; st.fillRect(0, 22, 1700, 1);
  if (running) {
    for (const f of F) { if (f.done > e) break; st.fillStyle = f.tier === "wasm" ? "#f6f1eacc" : AMBER; st.fillRect(SX(f.done) - (f.tier === "wasm" ? .75 : 1.5), 4, f.tier === "wasm" ? 1.5 : 3, 36); }
    if (e > H.compileStarted) { const a = SX(H.compileStarted), b = SX(Math.min(e, H.compileSecs)); st.fillStyle = BLUE; st.fillRect(a, 50, b - a, 4); st.font = '500 16px "JetBrains Mono"'; st.fillText("COMPILING", a, 69); }
    if (swapped) { st.fillStyle = GREEN; st.fillRect(SX(SWAP_E) - 1, 0, 2, 58); st.font = '500 16px "JetBrains Mono"'; st.fillText("SWITCH", SX(SWAP_E) + 8, 69); }
    st.fillStyle = "#fff"; st.fillRect(SX(Math.max(0, e)) - 1, 0, 2, 44);
  }
  $("#hud").style.opacity = ease(seg(t, START + .1, START + .7)) * (ended ? 0 : 1);
  // ── end card, on the music's last hit ──
  $("#black").style.opacity = ended ? lerp(1, .86, ease(seg(t, T_END + .1, T_END + 1.6))) : 0;
  words($("#end1"), `${X}× faster.`, T_END, 0, t, true);
  words($("#end2"), "AI writes more code every day.", T_END + 1.0, 0, t);
  words($("#end2b"), "Now that code makes itself fast. While it is already working.", T_END + 2.3, 0, t);
  words($("#end3"), `tierup · quickjs → scriptc wasm · ${H.identical}/${H.checked} predictions identical`, T_END + 4.0, 0, t);
};
renderAt(0);
</script></body></html>
